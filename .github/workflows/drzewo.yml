# Harmonogram drzewa: czeka na ocenę paczki, pyta politykę o następną i dispatchuje jej węzły albo zamyka
# drzewo i wyzwala offline. Wywołuje go koniec oceny każdego węzła; ręcznie startuje pierwsze drzewo:
#   gh workflow run drzewo.yml            # bieżące otwarte drzewo albo następne
# Idempotentny: wywołanie bez zmian w drzewie niczego nie robi. Kontrakt: docs/loop-config.md.
name: drzewo
run-name: drzewo ${{ inputs.drzewo || 'bieżące' }}

on:
  workflow_dispatch:
    inputs:
      drzewo:
        description: Numer drzewa; puste = bieżące otwarte albo następne
        required: false
        default: ""

# jedna grupa z offline: następne drzewo czeka, aż faza offline skończy; kroki jednego drzewa idą po kolei
concurrency:
  group: polityka
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  krok:
    if: vars.AUTOPILOT == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Krok harmonogramu
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          T=$(python3 .github/loop/drzewo.py numer "${{ inputs.drzewo }}")
          python3 .github/loop/drzewo.py krok "$T" > "$RUNNER_TEMP/akcje.txt"
          # stan przed dispatchem: powtórzony krok widzi paczkę i nie rozsyła jej drugi raz
          if [ -f "trees/$T.json" ]; then bash .github/loop/zapisz.sh "drzewo $T: krok" "trees/$T.json"; fi
          while read -r rodzaj drzewo wezel kolejnosc; do
            case "$rodzaj" in
              WEZEL) gh workflow run wezel.yml --ref "$DEFAULT_BRANCH" -f drzewo="$drzewo" -f wezel="$wezel" -f kolejnosc="$kolejnosc" ;;
              OFFLINE) gh workflow run offline.yml --ref "$DEFAULT_BRANCH" -f drzewo="$drzewo" ;;
            esac
          done < "$RUNNER_TEMP/akcje.txt"
